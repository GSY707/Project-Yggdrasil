apiVersion: yggdrasil.io/v0.1
kind: ApplicationManifest
metadata:
  id: yggdrasil.app.learning-coach
  displayName: Learning Coach
  version: 0.1.0
  owner: core
  description: Dedicated application for proactive learning support with ongoing learner-state tracking.
  defaultLoad: false
spec:
  dependencies:
    modules:
      - id: subagent-runtime
        version: ">=0.1.0 <0.2.0"
      - id: scene-learning-coach
        version: ">=0.1.0 <0.2.0"
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
      - id: context-pruning
        version: ">=0.1.0 <0.2.0"
  prompting:
    defaultPromptProfileId: yggdrasil.learning-coach.main-agent
    subagentPromptProfileId: yggdrasil.subagent
    defaultSeedTemplateId: yggdrasil.seed.learning.coach
    profileFiles:
      - prompt-profiles/main-agent.yaml
    seedTemplateFiles: []
    capabilityModules:
      - subagent-runtime
    sceneModules:
      - scene-learning-coach
  config:
    defaultsRef: config/defaults.json
  frontend:
    entryRoute: /applications/yggdrasil.app.learning-coach
    dashboardRef: web/dashboard.json