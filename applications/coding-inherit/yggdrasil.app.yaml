apiVersion: yggdrasil.io/v0.1
kind: ApplicationManifest
metadata:
  id: yggdrasil.app.coding-inherit
  displayName: Existing Project Studio
  version: 0.1.0
  owner: core
  description: Dedicated application for inheriting and safely evolving existing software projects.
  defaultLoad: false
spec:
  dependencies:
    modules:
      - id: subagent-runtime
        version: ">=0.1.0 <0.2.0"
      - id: scene-coding-inherit-project
        version: ">=0.1.0 <0.2.0"
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
      - id: context-pruning
        version: ">=0.1.0 <0.2.0"
      - id: subagent-pr
        version: ">=0.1.0 <0.2.0"
  prompting:
    defaultPromptProfileId: yggdrasil.coding-inherit.main-agent
    subagentPromptProfileId: yggdrasil.subagent
    defaultSeedTemplateId: yggdrasil.seed.coding.inherit-project
    profileFiles:
      - prompt-profiles/main-agent.yaml
    seedTemplateFiles: []
    capabilityModules:
      - subagent-runtime
    sceneModules:
      - scene-coding-inherit-project
  config:
    defaultsRef: config/defaults.json
  frontend:
    entryRoute: /applications/yggdrasil.app.coding-inherit
    dashboardRef: web/dashboard.json