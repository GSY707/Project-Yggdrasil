apiVersion: yggdrasil.io/v0.1
kind: ApplicationManifest
metadata:
  id: yggdrasil.app.maintenance-ops
  displayName: Maintenance Ops
  version: 0.1.0
  owner: core
  description: Dedicated application for maintenance, repair, and regression-safe stabilization work.
  defaultLoad: false
spec:
  dependencies:
    modules:
      - id: subagent-runtime
        version: ">=0.1.0 <0.2.0"
      - id: scene-maintenance-default
        version: ">=0.1.0 <0.2.0"
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
      - id: context-pruning
        version: ">=0.1.0 <0.2.0"
      - id: subagent-pr
        version: ">=0.1.0 <0.2.0"
  prompting:
    defaultPromptProfileId: yggdrasil.maintenance-ops.main-agent
    subagentPromptProfileId: yggdrasil.subagent
    defaultSeedTemplateId: yggdrasil.seed.maintenance.default
    profileFiles:
      - prompt-profiles/main-agent.yaml
    seedTemplateFiles: []
    capabilityModules:
      - subagent-runtime
    sceneModules:
      - scene-maintenance-default
  config:
    defaultsRef: config/defaults.json
  frontend:
    entryRoute: /applications/yggdrasil.app.maintenance-ops
    dashboardRef: web/dashboard.json