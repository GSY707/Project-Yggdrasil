name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YGGDRASIL_DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/.ci/yggdrasil.db
      YGGDRASIL_AUTO_CREATE_SCHEMA: "1"
      YGGDRASIL_REDIS_URL: redis://127.0.0.1:6390/15
      YGGDRASIL_STATE_ROOT: ${{ github.workspace }}/.ci/state-root
      YGGDRASIL_CORE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Prepare CI state directories
        run: mkdir -p .ci/state-root

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Install web workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python tests
        run: pnpm run test:python

      - name: List evaluation suites
        run: pnpm run eval:list

      - name: Run regression evaluation suite
        run: pnpm run eval:regression

      - name: Lint web workbench
        run: pnpm run web:lint

      - name: Typecheck web workbench
        run: pnpm run web:typecheck

      - name: Build web workbench
        run: pnpm run web:build