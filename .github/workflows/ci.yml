name: merge-smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Python syntax smoke
        run: pnpm run check:python:syntax

      - name: Install web workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web workbench
        run: pnpm run web:lint

      - name: Typecheck web workbench
        run: pnpm run web:typecheck

      - name: Build web workbench
        run: pnpm run web:build