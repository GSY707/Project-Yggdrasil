name: release-check

on:
  workflow_dispatch:
    inputs:
      run_live_provider_smoke:
        description: "Run eval:m8:live (requires provider secrets and may incur cost)"
        required: false
        default: false
        type: boolean

jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Verify Alembic migration head matches ORM
        run: bash scripts/check_migrations.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Run compose smoke test
        run: bash scripts/smoke_test.sh

  full-regression:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YGGDRASIL_DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/.ci/yggdrasil.db
      YGGDRASIL_AUTO_CREATE_SCHEMA: "1"
      YGGDRASIL_REDIS_URL: redis://127.0.0.1:6390/15
      YGGDRASIL_STATE_ROOT: ${{ github.workspace }}/.ci/state-root
      YGGDRASIL_CORE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Prepare CI state directories
        run: mkdir -p .ci/state-root

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Install web workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full offline release check
        run: pnpm run release:check

  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: yggdrasil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d yggdrasil"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YGGDRASIL_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/yggdrasil
      YGGDRASIL_AUTO_CREATE_SCHEMA: "1"
      YGGDRASIL_REDIS_URL: redis://127.0.0.1:6390/15
      YGGDRASIL_STATE_ROOT: ${{ github.workspace }}/.ci/state-root
      YGGDRASIL_CORE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Prepare CI state directories
        run: mkdir -p .ci/state-root

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Run PostgreSQL regression gate
        run: uv run pytest --postgres -m "not slow"

  live-provider-smoke:
    if: ${{ inputs.run_live_provider_smoke }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      YGGDRASIL_DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/.ci/yggdrasil.db
      YGGDRASIL_AUTO_CREATE_SCHEMA: "1"
      YGGDRASIL_REDIS_URL: redis://127.0.0.1:6390/15
      YGGDRASIL_STATE_ROOT: ${{ github.workspace }}/.ci/state-root
      YGGDRASIL_CORE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Prepare CI state directories
        run: mkdir -p .ci/state-root

      - name: Install Python workspace dependencies
        run: uv sync --all-packages --group dev

      - name: Install web workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live provider smoke
        run: pnpm run eval:m8:live