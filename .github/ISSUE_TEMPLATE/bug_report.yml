name: Bug Report
description: 报告一个可复现的缺陷
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢提交缺陷报告。请尽量提供可复现信息。

        如果问题涉及安全风险、密钥泄露、提权、任意文件写入或漏洞细节，请不要继续填写这个公开表单，改按 SECURITY.md 私下披露。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 用 1 到 3 段话说明你观察到的错误行为。
      placeholder: 例如：在 Windows 本地启动 agent-runtime 后，任务恢复阶段会报错...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出最小复现步骤。
      placeholder: |
        1. 执行 ...
        2. 打开 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      placeholder: 例如：任务应当恢复成功，并继续执行后续步骤。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 例如：返回 500，并在日志中看到 ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 相关版本或提交
      description: 如果知道，请填写 tag、commit hash 或分支。
      placeholder: main / v0.x / 1a2b3c4d

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Ubuntu / Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请只粘贴脱敏后的日志，不要包含真实 key 或私有数据。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，未发现同类问题。
          required: true
        - label: 我确认内容中不包含真实 API key、token、密码或私有数据。
          required: true