name: Feature Request
description: 提出一个兼容范围内的功能请求
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        如果你的提案会改变架构边界、公共接口、协议契约、模块生命周期或默认兼容性，请不要使用这个表单，改按 docs/rfcs/README.md 提交 RFC。

  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 先描述现状中的痛点，而不是直接给结论。
      placeholder: 例如：当前模块作者很难在不启动全套 infra 的情况下验证自己的 Hook...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 说明你希望发生什么变化。
      placeholder: 例如：提供一个更轻量的本地开发路径，允许只启动必要组件...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 如果你考虑过其他方案，请一并写出。

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 说明会影响哪些服务、模块、用户工作流或文档。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这不是安全漏洞披露。
          required: true
        - label: 我确认这不是需要先走 RFC 的重大设计变更。
          required: true