[tool.uv.workspace]
members = [
  "packages/python-sdk",
  "services/core-api",
  "services/agent-runtime",
  "services/module-host",
  "services/worker",
  "modules/text-memory",
  "modules/context-pruning",
  "modules/subagent-pr",
  "modules/shared-memory",
  "modules/pause-resume",
  "modules/multimodal-memory",
  "modules/memory-organizer",
  "modules/relation-discovery",
  "modules/training-lab",
  "adapters/model-providers",
  "adapters/media-providers"
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pytest-xdist>=3.8.0",
  "pytest-timeout>=2.3.1"
]

[tool.uv.sources]
yggdrasil-model-providers = { workspace = true }
yggdrasil-media-providers = { workspace = true }
yggdrasil-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"