name: yggdrasil-langfuse

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: yggdrasil-langfuse-worker
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_WORKER_PORT:-3130}:3030"
    environment: &langfuse-common-env
      DATABASE_URL: postgresql://postgres:${YGGDRASIL_LANGFUSE_POSTGRES_PASSWORD:-langfuse-postgres-local}@langfuse-postgres:5432/${YGGDRASIL_LANGFUSE_POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: http://localhost:${YGGDRASIL_LANGFUSE_WEB_PORT:-3100}
      SALT: ${YGGDRASIL_LANGFUSE_SALT:-langfuse-local-salt}
      ENCRYPTION_KEY: ${YGGDRASIL_LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${YGGDRASIL_LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${YGGDRASIL_LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse-clickhouse-local}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${YGGDRASIL_LANGFUSE_REDIS_PASSWORD:-langfuse-redis-local}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${YGGDRASIL_LANGFUSE_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${YGGDRASIL_LANGFUSE_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: yggdrasil-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "${YGGDRASIL_LANGFUSE_WEB_PORT:-3100}:3000"
    environment:
      <<: *langfuse-common-env
      NEXTAUTH_SECRET: ${YGGDRASIL_LANGFUSE_NEXTAUTH_SECRET:-langfuse-local-nextauth-secret}
      LANGFUSE_INIT_ORG_ID: ${YGGDRASIL_LANGFUSE_INIT_ORG_ID:-org-yggdrasil-local}
      LANGFUSE_INIT_ORG_NAME: ${YGGDRASIL_LANGFUSE_INIT_ORG_NAME:-Yggdrasil Local}
      LANGFUSE_INIT_PROJECT_ID: ${YGGDRASIL_LANGFUSE_INIT_PROJECT_ID:-project-yggdrasil-local}
      LANGFUSE_INIT_PROJECT_NAME: ${YGGDRASIL_LANGFUSE_INIT_PROJECT_NAME:-Yggdrasil Local}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${YGGDRASIL_LANGFUSE_PROJECT_PUBLIC_KEY:-pk-lf-yggdrasil-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${YGGDRASIL_LANGFUSE_PROJECT_SECRET_KEY:-sk-lf-yggdrasil-local-secret}
      LANGFUSE_INIT_USER_EMAIL: ${YGGDRASIL_LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${YGGDRASIL_LANGFUSE_INIT_USER_NAME:-Local Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${YGGDRASIL_LANGFUSE_INIT_USER_PASSWORD:-LangfuseLocal123!}

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    container_name: yggdrasil-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${YGGDRASIL_LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${YGGDRASIL_LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse-clickhouse-local}
    ports:
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_CLICKHOUSE_NATIVE_PORT:-19092}:9000"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: yggdrasil-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${YGGDRASIL_LANGFUSE_MINIO_ROOT_PASSWORD:-miniosecret}
    ports:
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_MINIO_API_PORT:-19090}:9000"
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_MINIO_CONSOLE_PORT:-19091}:9001"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 1s

  langfuse-redis:
    image: docker.io/redis:7
    container_name: yggdrasil-langfuse-redis
    restart: unless-stopped
    command: >
      --requirepass ${YGGDRASIL_LANGFUSE_REDIS_PASSWORD:-langfuse-redis-local}
      --maxmemory-policy noeviction
    environment:
      REDIS_AUTH: ${YGGDRASIL_LANGFUSE_REDIS_PASSWORD:-langfuse-redis-local}
    ports:
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_REDIS_PORT:-16379}:6379"
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep PONG"]
      interval: 3s
      timeout: 10s
      retries: 20

  langfuse-postgres:
    image: docker.io/postgres:17
    container_name: yggdrasil-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${YGGDRASIL_LANGFUSE_POSTGRES_PASSWORD:-langfuse-postgres-local}
      POSTGRES_DB: ${YGGDRASIL_LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${YGGDRASIL_LANGFUSE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data: