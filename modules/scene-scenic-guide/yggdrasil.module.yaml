apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: scene-scenic-guide
  displayName: Scenic Guide Scene
  version: 0.1.0
  category: core-extension
  owner: core
  description: Contributes the scenic-guide service seed template.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_sdk.prompt_modules.scene_scenic_guide:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules: []
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - prompt.seed-templates.register
    publishes: []
    subscribes: []
  configSchema:
    type: object
    additionalProperties: false
    properties: {}
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested: []
  healthChecks:
    - kind: in-process
      timeoutMs: 3000