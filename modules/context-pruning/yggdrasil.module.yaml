apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: context-pruning
  displayName: Context Pruning
  version: 0.1.0
  category: runtime
  owner: core
  description: Objective-aware context pruning and compression for long-running task recovery.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_context_pruning.plugin:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules:
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - context.pruning.plan
      - context.pruning.execute
    publishes:
      - context.pruning.planned
      - context.pruning.completed
    subscribes:
      - context.pruning.requested
  configSchema:
    type: object
    additionalProperties: false
    properties:
      maxRetainedTokens:
        type: integer
        minimum: 256
      compressionTargetRatio:
        type: number
        minimum: 0.1
        maximum: 0.9
    required:
      - maxRetainedTokens
      - compressionTargetRatio
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - task.snapshot.read
      - task.snapshot.write
      - node.read
  healthChecks:
    - kind: in-process
      timeoutMs: 3000