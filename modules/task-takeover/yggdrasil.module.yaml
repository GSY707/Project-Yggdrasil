apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: task-takeover
  displayName: Task Takeover
  version: 0.1.0
  category: runtime
  owner: core
  description: Formalizes Gate 2 task takeover protocol for objective parsing, constraints, planning, verification, and delivery formatting.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_task_takeover.plugin:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules: []
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - task.takeover.parse-objective
      - task.takeover.extract-constraints
      - task.takeover.generate-plan
      - task.takeover.verify-delivery
      - task.takeover.format-output
    publishes:
      - task.takeover.prepared
      - task.takeover.verified
      - task.takeover.completed
    subscribes: []
  configSchema:
    type: object
    additionalProperties: false
    properties:
      requireEvidenceSection:
        type: boolean
      requireExplicitPendingSection:
        type: boolean
    required: []
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - task.read
      - node.read
  healthChecks:
    - kind: in-process
      timeoutMs: 3000