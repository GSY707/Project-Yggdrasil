[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-memory-organizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "yggdrasil-sdk"
]

[project.entry-points."yggdrasil.modules"]
memory-organizer = "yggdrasil_memory_organizer.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdrasil_memory_organizer"]