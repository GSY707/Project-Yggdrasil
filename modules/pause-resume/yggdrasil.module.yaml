apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: pause-resume
  displayName: Pause Resume
  version: 0.1.0
  category: runtime
  owner: core
  description: Safe-stop snapshot preparation and resume rehydration for long-running tasks.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_pause_resume.plugin:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules:
      - id: context-pruning
        version: ">=0.1.0 <0.2.0"
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - task.pause.prepare
      - task.resume.rehydrate
    publishes:
      - task.paused
      - task.resumed
    subscribes: []
  configSchema:
    type: object
    additionalProperties: false
    properties:
      maxResumeContextItems:
        type: integer
        minimum: 1
      retainedProtectedItems:
        type: integer
        minimum: 1
    required:
      - maxResumeContextItems
      - retainedProtectedItems
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - task.snapshot.read
      - task.snapshot.write
      - task.read
  healthChecks:
    - kind: in-process
      timeoutMs: 3000