apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: subagent-pr
  displayName: Sub-Agent PR
  version: 0.1.0
  category: runtime
  owner: core
  description: Branch-scoped sub-agent review, pull request, and merge orchestration module.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_subagent_pr.plugin:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules:
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - agent.tools.register
      - worker.activities.register
    publishes:
      - pr.created
      - pr.reviewed
    subscribes:
      - task.started
  configSchema:
    type: object
    additionalProperties: false
    properties:
      reviewMode:
        type: string
        enum: [minimal, balanced, strict]
    required:
      - reviewMode
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - pr.write
      - branch.write
  healthChecks:
    - kind: in-process
      timeoutMs: 3000