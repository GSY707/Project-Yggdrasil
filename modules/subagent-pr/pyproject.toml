[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-subagent-pr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "yggdrasil-sdk"
]

[project.entry-points."yggdrasil.modules"]
subagent-pr = "yggdrasil_subagent_pr.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdrasil_subagent_pr"]