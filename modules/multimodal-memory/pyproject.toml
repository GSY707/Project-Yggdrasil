[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-multimodal-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "yggdrasil-sdk",
  "yggdrasil-media-providers"
]

[project.entry-points."yggdrasil.modules"]
multimodal-memory = "yggdrasil_multimodal_memory.plugin:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdrasil_multimodal_memory"]