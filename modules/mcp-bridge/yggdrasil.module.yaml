apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: mcp-bridge
  displayName: MCP Bridge
  version: 0.1.0
  category: integration
  owner: core
  description: Bridge external and builtin MCP servers into the Yggdrasil tool registry.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_sdk.mcp_bridge_module:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules: []
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - agent.tools.register
    publishes: []
    subscribes: []
  configSchema:
    type: object
    additionalProperties: false
    properties:
      projectWorkspace:
        type: string
      servers:
        type: array
        items:
          type: object
    required:
      - projectWorkspace
      - servers
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - node.read
  healthChecks:
    - kind: in-process
      timeoutMs: 5000