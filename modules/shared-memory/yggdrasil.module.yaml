apiVersion: yggdrasil.io/v0.1
kind: ModuleManifest
metadata:
  id: shared-memory
  displayName: Shared Memory
  version: 0.1.0
  category: collaboration
  owner: core
  description: Shared space mount resolution, permission tuple evaluation, and mounted memory consumption.
spec:
  runtime:
    mode: in-process
    entryPoint: yggdrasil_shared_memory.plugin:plugin
    protocol: python-entrypoint
  compatibility:
    kernel: ">=0.1.0 <0.2.0"
  dependencies:
    modules:
      - id: text-memory
        version: ">=0.1.0 <0.2.0"
    adapters: []
    services: []
  capabilities:
    hooks:
      - module.enable.preflight
      - module.health.report
      - agent.tools.register
      - agent.startup.mount-root
      - memory.retrieve.expand
      - memory.write.validate
    publishes: []
    subscribes: []
  configSchema:
    type: object
    additionalProperties: false
    properties:
      maxMountedBranches:
        type: integer
        minimum: 1
      maxExpandedNodes:
        type: integer
        minimum: 1
    required:
      - maxMountedBranches
      - maxExpandedNodes
  migrations:
    strategy: none
    revisions: []
  frontend:
    panels: []
    routes: []
  permissions:
    requested:
      - space.read
      - space.write
      - node.read
      - node.write
  healthChecks:
    - kind: in-process
      timeoutMs: 3000