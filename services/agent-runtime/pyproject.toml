[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "yggdrasil-sdk"
]

[project.scripts]
yggdrasil-agent-runtime = "yggdrasil_agent_runtime.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdrasil_agent_runtime"]