[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "yggdrasil-module-host"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "PyYAML>=6.0.2",
  "uvicorn>=0.34.0",
  "yggdrasil-sdk"
]

[project.scripts]
yggdrasil-module-host = "yggdrasil_module_host.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdrasil_module_host"]